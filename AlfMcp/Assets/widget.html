<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Widget</title>
<script>[[jquery]]</script>
<script>[[tailwind]]</script>
<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));
@theme inline {
    --color-fg: var(--fg);
    --color-muted: var(--muted);
    --color-line: var(--line);
    --color-surface: var(--surface);
    --color-accent: var(--accent);
}
/* Form alanları tema renklerini kullanır (koyu temada beyaz zemin / okunmayan yazı olmasın). base katmanında: widget'ın kendi Tailwind sınıfları yine üstün gelir. */
@layer base {
    input, select, textarea, button { font: inherit; color: var(--fg); }
    input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=button]):not([type=submit]), select, textarea {
        background-color: var(--field);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 0.25rem 0.5rem;
    }
    option, optgroup { background-color: var(--field-solid); color: var(--fg); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input, select, textarea { accent-color: var(--accent); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
}
</style>
<style>
/* Tema renkleri tek yerde: widget'lar text-fg, text-muted, border-line, bg-surface, text-accent yazar, dark: çifti gerekmez. */
/* color-scheme iframe belgesinde istemciyle aynı olmalı; aksi halde tarayıcı saydam yerine opak beyaz zemin boyar. */
:root { color-scheme: light; --fg: #171717; --muted: #737373; --line: #e5e5e5; --surface: rgba(0, 0, 0, 0.035); --accent: #2563eb; --field: rgba(0, 0, 0, 0.03); --field-solid: #ffffff; }
:root.dark { color-scheme: dark; --fg: #f5f5f5; --muted: #a3a3a3; --line: #3a3a3a; --surface: rgba(255, 255, 255, 0.06); --accent: #60a5fa; --field: rgba(255, 255, 255, 0.07); --field-solid: #262626; }
html, body { background: transparent; margin: 0; }
/* En yüksek yükseklik: uzun içerik sohbeti taşırmaz, widget'ın kendi içinde kayar. */
#root { max-height: 420px; overflow-y: auto; }
body { color: var(--fg); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 2px; }
</style>
<script>document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);</script>
</head>
<body>
<div id="root"></div>
<script>
// Köprü (MCP Apps): istemciyle postMessage üzerinden JSON-RPC konuşur, araç sonucundaki widget'ı çizer.
var Ui = (function () {

    var pending = {};
    var nextId = 1;
    var drawn = false;

    function rpc(method, params) {
        return new Promise(function (resolve, reject) {
            var id = nextId++;
            pending[id] = { resolve: resolve, reject: reject };
            parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params }, '*');
        });
    }

    function notify(method, params) {
        parent.postMessage({ jsonrpc: '2.0', method: method, params: params }, '*');
    }

    function theme(context) {
        if (context && (context.theme === 'dark' || context.theme === 'light')) {
            document.documentElement.classList.toggle('dark', context.theme === 'dark');
        }
    }

    function draw(result) {
        var data = result && result.structuredContent;
        if (!data || drawn) {
            return;
        }
        drawn = true;
        window.args = Ui.args = data.args || {};
        // jQuery html() widget içindeki <script> bloklarını çalıştırır (args ve Ui genel değişkendir).
        $('#root').html(data.html || '');
    }

    addEventListener('message', function (event) {
        var message = event.data;
        if (!message || message.jsonrpc !== '2.0') {
            return;
        }
        if (message.method === 'ui/notifications/tool-result') {
            draw(message.params);
        }
        else if (message.method === 'ui/notifications/host-context-changed') {
            theme(message.params);
        }
        else if (message.id !== undefined && !message.method && pending[message.id]) {
            var waiting = pending[message.id];
            delete pending[message.id];
            if (message.error) {
                waiting.reject(new Error(message.error.message));
            }
            else {
                waiting.resolve(message.result);
            }
        }
    });

    $(function () {
        if (window.ResizeObserver) {
            new ResizeObserver(function () {
                // İçeriğin kendi yüksekliği bildirilir (documentElement değil): iframe yüksekliğine kilitlenip küçülememe sorunu olmasın.
                notify('ui/notifications/size-changed', { width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height) });
            }).observe(document.body);
        }
        rpc('ui/initialize', { appInfo: { name: 'alf-widget', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' }).then(function (result) {
            theme(result && result.hostContext);
            notify('ui/notifications/initialized', {});
        });
    });

    return {
        args: {},
        // confirm()/alert() iframe'de engelli (allow-modals yok); onay için bunu kullan: Ui.confirm('Silinsin mi?').then(function (yes) { ... }).
        // Onay çubuğu içeriğin üstünde satır içi açılır, widget ne kadar kısa olursa olsun sığar.
        confirm: function (message, yesLabel, noLabel) {
            return new Promise(function (resolve) {
                var bar = $('<div class="mb-2 flex items-center justify-between gap-3 rounded-xl border border-line bg-surface p-3 text-sm"></div>');
                var done = function (answer) {
                    bar.remove();
                    resolve(answer);
                };
                bar.append($('<span class="text-fg"></span>').text(message));
                var buttons = $('<span class="flex gap-2"></span>');
                buttons.append($('<button type="button" class="rounded-lg bg-accent px-3 py-1 text-white"></button>').text(yesLabel || 'Evet').on('click', function () {
                    done(true);
                }));
                buttons.append($('<button type="button" class="rounded-lg border border-line px-3 py-1 text-fg"></button>').text(noLabel || 'Hayır').on('click', function () {
                    done(false);
                }));
                bar.append(buttons);
                $('#root').prepend(bar);
            });
        },
        // Kayıtlı bir betiği (script) çalıştırır ve sonucunu verir.
        call: function (name, values) {
            return rpc('tools/call', { name: 'script', arguments: { name: name, args: values || {} } }).then(function (result) {
                var text = ((result.content || []).find(function (item) { return item.type === 'text'; }) || {}).text || '';
                if (result.isError) {
                    throw new Error(text);
                }
                return JSON.parse(text).result;
            });
        }
    };

})();
</script>
</body>
</html>
